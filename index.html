<style>
  :root{
    --bg:#F3F5F9; --panel:#FFFFFF; --panel2:#EDF1F7; --border:#E1E7F0;
    --text:#111827; --muted:#5B6B80; --faint:#8DA0B8;
    --good:#1FA35C; --good-bg:#E3F5EB;
    --shadow:0 8px 28px rgba(20,30,50,.08);
    --accent:#3B7DD8; --accent-soft:rgba(59,125,216,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0C0F15; --panel:#151A23; --panel2:#1A2130; --border:#242E3E;
      --text:#ECF1F8; --muted:#93A3B8; --faint:#5F7189;
      --good:#3BD584; --good-bg:rgba(59,213,132,.14);
      --shadow:0 8px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#F3F5F9; --panel:#FFFFFF; --panel2:#EDF1F7; --border:#E1E7F0;
    --text:#111827; --muted:#5B6B80; --faint:#8DA0B8;
    --good:#1FA35C; --good-bg:#E3F5EB;
    --shadow:0 8px 28px rgba(20,30,50,.08);
  }
  :root[data-theme="dark"]{
    --bg:#0C0F15; --panel:#151A23; --panel2:#1A2130; --border:#242E3E;
    --text:#ECF1F8; --muted:#93A3B8; --faint:#5F7189;
    --good:#3BD584; --good-bg:rgba(59,213,132,.14);
    --shadow:0 8px 28px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size:16px; line-height:1.45;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .wrap{max-width:520px; margin:0 auto; padding:0 14px}

  /* ---------- Header + day strip ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top);
  }
  .topline{display:flex; align-items:center; justify-content:space-between; padding:12px 2px 8px}
  .brand{font-weight:800; letter-spacing:-.02em; font-size:17px; display:flex; align-items:center; gap:8px}
  .brand em{font-style:normal; color:var(--accent)}
  .logo{
    width:28px; height:28px; border-radius:8px; background:#0C0F15;
    display:grid; place-items:center; flex:0 0 28px;
    box-shadow:0 2px 6px rgba(10,20,40,.25);
  }
  .logo svg{width:22px; height:22px; display:block}
  .today-date{font-size:12.5px; color:var(--muted); font-weight:600}

  .daystrip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:0 0 10px}
  .daychip{
    appearance:none; border:1px solid var(--border); background:var(--panel);
    border-radius:14px; padding:7px 0 6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    color:var(--muted); font-family:inherit; transition:transform .12s ease;
  }
  .daychip:active{transform:scale(.94)}
  .daychip .d1{font-size:11px; font-weight:700; letter-spacing:.06em}
  .daychip .dot{width:5px; height:5px; border-radius:50%; background:transparent; margin-top:2px}
  .daychip.is-today .dot{background:var(--accent)}
  .daychip.is-active{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }
  .daychip.is-active .dot{background:rgba(255,255,255,.85)}
  .daychip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---------- Hero ---------- */
  .hero{
    margin-top:14px; border-radius:20px; padding:18px 16px 14px;
    background:linear-gradient(140deg, var(--accent-soft), transparent 55%), var(--panel);
    border:1px solid var(--border); box-shadow:var(--shadow);
  }
  .hero .eyebrow{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  }
  .carb-pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:700; letter-spacing:.05em;
    padding:3px 9px; border-radius:999px; background:var(--panel2); border:1px solid var(--border);
  }
  .carb-pill .cdot{width:7px; height:7px; border-radius:50%}
  .hero h1{
    margin:6px 0 2px; font-size:30px; line-height:1.08; letter-spacing:-.03em; font-weight:800;
    text-wrap:balance;
  }
  .hero .focus{color:var(--accent); font-weight:700; font-size:15.5px; margin-bottom:12px}
  .macros{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .macro{
    background:var(--panel2); border:1px solid var(--border); border-radius:14px;
    padding:8px 6px 7px; text-align:center;
  }
  .macro b{display:block; font-size:16.5px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .macro span{display:block; font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:1px}

  /* ---------- Segmented control ---------- */
  .seg{
    margin:16px 0 6px; display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
    background:var(--panel2); border:1px solid var(--border); border-radius:14px; padding:4px;
  }
  .seg button{
    appearance:none; border:0; background:transparent; border-radius:10px;
    padding:8px 0; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .seg button.is-on{background:var(--panel); color:var(--text); box-shadow:0 2px 8px rgba(10,20,40,.12)}
  .seg button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .progress-row{display:flex; align-items:center; gap:10px; margin:8px 2px 12px}
  .pbar{flex:1; height:5px; border-radius:99px; background:var(--panel2); overflow:hidden}
  .pbar i{display:block; height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .3s ease}
  .pcount{font-size:12px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}

  /* ---------- Item cards ---------- */
  .list{display:flex; flex-direction:column; gap:8px}
  .group-label{
    margin:14px 2px 2px; font-size:11.5px; font-weight:800; letter-spacing:.1em;
    text-transform:uppercase; color:var(--faint);
  }
  .item{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:12px 13px; cursor:pointer; user-select:none; -webkit-user-select:none;
    transition:opacity .15s ease;
  }
  .item .chk{
    flex:0 0 24px; width:24px; height:24px; margin-top:1px;
    border-radius:50%; border:2px solid var(--faint); position:relative; transition:all .15s ease;
  }
  .item.is-done{opacity:.55}
  .item.is-done .chk{background:var(--good); border-color:var(--good)}
  .item.is-done .chk::after{
    content:""; position:absolute; left:6px; top:2.5px; width:5px; height:10px;
    border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(42deg);
  }
  .item.is-done .t-main{text-decoration:line-through}
  .item .body{flex:1; min-width:0}
  .t-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .t-main{font-weight:700; font-size:15.5px; letter-spacing:-.01em}
  .t-badge{
    flex:0 0 auto; font-size:11.5px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); padding:2px 8px; border-radius:999px; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .t-sub{font-size:13.5px; color:var(--text); opacity:.85; margin-top:1px}
  .t-note{font-size:12.5px; color:var(--muted); margin-top:3px}
  .t-macro{font-size:12px; color:var(--muted); font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums}

  /* ---------- Non-negotiables ---------- */
  .nn{margin-top:22px}
  .nn-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .nn-chip{
    display:flex; align-items:center; gap:9px;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:10px 12px; cursor:pointer; user-select:none; -webkit-user-select:none;
    font-size:13px; font-weight:600;
  }
  .nn-chip .chk{flex:0 0 20px; width:20px; height:20px; border-radius:50%; border:2px solid var(--faint); position:relative}
  .nn-chip.is-done{background:var(--good-bg); border-color:color-mix(in srgb, var(--good) 40%, var(--border))}
  .nn-chip.is-done .chk{background:var(--good); border-color:var(--good)}
  .nn-chip.is-done .chk::after{
    content:""; position:absolute; left:5px; top:1.5px; width:4px; height:9px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(42deg);
  }

  .foot{margin-top:26px; text-align:center; font-size:12px; color:var(--faint)}
  .reset-btn{
    appearance:none; border:1px solid var(--border); background:var(--panel); color:var(--muted);
    font-family:inherit; font-size:12px; font-weight:600; border-radius:999px; padding:6px 14px;
    margin-top:8px; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>

<header>
  <div class="wrap">
    <div class="topline">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 512 512">
            <rect x="116" y="230" width="280" height="52" rx="26" fill="#8DA0B8"/>
            <rect x="116" y="146" width="68" height="220" rx="24" fill="#D6762B"/>
            <rect x="328" y="146" width="68" height="220" rx="24" fill="#D6762B"/>
            <rect x="72"  y="186" width="44" height="140" rx="14" fill="#3B7DD8"/>
            <rect x="396" y="186" width="44" height="140" rx="14" fill="#3B7DD8"/>
          </svg>
        </span>
        <span>Fit<em>Day</em></span>

      <div class="today-date" id="todayDate"></div>

</header>

<main class="wrap">
  <section class="hero" id="hero"></section>

  <div class="seg" id="seg" role="tablist" aria-label="Section">

    <button data-tab="meals">Meals</button>
    <button data-tab="supps">Supps</button>
  </div>

  <div class="progress-row">
    <div class="pbar"><i id="pfill"></i></div>
    <div class="pcount" id="pcount">0 / 0</div>
  </div>

  <div class="list" id="list"></div>

  <section class="nn">
    <div class="group-label">Daily Non-Negotiables</div>
    <div class="nn-grid" id="nnGrid"></div>
  </section>

  <div class="foot">
    Checks clear every Monday · saved on this device
    <br><button class="reset-btn" id="resetBtn">Reset this day’s checks</button>
  </div>
</main>

<script>

const VEG_COOK = "Steamed or pan-fried veggies: broccoli + bell peppers + carrots + spinach with garlic & olive oil";

const DAYS = {

      SNACK_PM,

  2:{name:"Tuesday", focus:"Push — Chest / Shoulders / Triceps · Morning Gym", carb:"MEDIUM", hue:"#2E9E63",

const CARB_COLORS = {HIGH:"#3BD584", MEDIUM:"#E8B93E", LOW:"#E86A5E"};
const NON_NEG = ["Drink 3–4L water", "Hit 8,000+ steps", "Sleep 7–8 hrs", "Zero liquid calories"];
const DAY_ORDER = [1,2,3,4,5,6,0];
const DAY_LETTERS = {1:"M",2:"T",3:"W",4:"T",5:"F",6:"S",0:"S"};

/* ================= STATE ================= */
const todayIdx = new Date().getDay();
let viewIdx = todayIdx;
let tab = "workout";

function weekKey(){
  // Key = the date of this week's Monday, so all checks clear every Monday
  const d = new Date();
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
  return monday.getFullYear() + "-" + (monday.getMonth()+1) + "-" + monday.getDate();
}
function storeKey(dayIdx){ return "fitday:" + weekKey() + ":" + dayIdx; }
function loadChecks(dayIdx){
  try{ return new Set(JSON.parse(localStorage.getItem(storeKey(dayIdx)) || "[]")); }
  catch(e){ return new Set(); }
}
function saveChecks(dayIdx, set){
  localStorage.setItem(storeKey(dayIdx), JSON.stringify([...set]));
}

/* ================= RENDER ================= */
const $ = s => document.querySelector(s);

function setAccent(hue){
  document.documentElement.style.setProperty("--accent", hue);
  document.documentElement.style.setProperty("--accent-soft", hue + "22");
}

function renderDayStrip(){
  const strip = $("#daystrip");
  strip.innerHTML = "";
  DAY_ORDER.forEach(idx=>{
    const b = document.createElement("button");
    b.className = "daychip" + (idx===viewIdx?" is-active":"") + (idx===todayIdx?" is-today":"");
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", idx===viewIdx);
    b.setAttribute("aria-label", DAYS[idx].name);
    b.innerHTML = `<span class="d1">${DAY_LETTERS[idx]}</span><span class="dot"></span>`;
    b.onclick = ()=>{ viewIdx = idx; render(); };
    strip.appendChild(b);
  });
}

function renderHero(){
  const d = DAYS[viewIdx];
  const isToday = viewIdx===todayIdx;
  $("#hero").innerHTML = `
    <div class="eyebrow">
      <span>${isToday ? "Today" : d.name}</span>
      <span class="carb-pill"><span class="cdot" style="background:${CARB_COLORS[d.carb]}"></span>${d.carb} CARB</span>
    </div>
    <h1>${d.name}</h1>
    <div class="focus">${d.focus}</div>
    <div class="macros">
      <div class="macro"><b>${d.kcal}</b><span>kcal</span></div>
      <div class="macro"><b>${d.p}</b><span>protein</span></div>
      <div class="macro"><b>${d.c}</b><span>carbs</span></div>
      <div class="macro"><b>${d.f}</b><span>fat</span></div>
    </div>`;
}

function makeItem(id, checks, html){
  const el = document.createElement("div");
  el.className = "item" + (checks.has(id)?" is-done":"");
  el.setAttribute("role","checkbox");
  el.setAttribute("aria-checked", checks.has(id));
  el.tabIndex = 0;
  el.innerHTML = `<span class="chk"></span><div class="body">${html}</div>`;
  const toggle = ()=>{
    checks.has(id) ? checks.delete(id) : checks.add(id);
    saveChecks(viewIdx, checks);
    el.classList.toggle("is-done");
    el.setAttribute("aria-checked", checks.has(id));
    updateProgress(checks);
  };
  el.onclick = toggle;
  el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
  return el;
}

function tabItemIds(){
  const d = DAYS[viewIdx];
  if(tab==="workout") return d.workout.map((_,i)=>"workout:w"+i);
  if(tab==="meals") return d.meals.map((_,i)=>"meals:m"+i);
  return d.supps.map((_,i)=>"supps:s"+i);
}

function updateProgress(checks){
  const ids = tabItemIds();
  const done = ids.filter(id=>checks.has(id)).length;
  $("#pfill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#pcount").textContent = done + " / " + ids.length;
}

function renderList(){
  const d = DAYS[viewIdx];
  const checks = loadChecks(viewIdx);
  const list = $("#list");
  list.innerHTML = "";

  if(tab==="workout"){
    d.workout.forEach((w,i)=>{
      list.appendChild(makeItem("workout:w"+i, checks, `
        <div class="t-top"><span class="t-main">${w.n}</span><span class="t-badge">${w.sr}</span></div>
        <div class="t-sub">${w.cue}</div>
        ${w.rest ? `<div class="t-note">Rest ${w.rest}</div>` : ""}`));
    });
  } else if(tab==="meals"){
    d.meals.forEach((m,i)=>{
      list.appendChild(makeItem("meals:m"+i, checks, `
        <div class="t-top"><span class="t-main">${m.n}</span><span class="t-badge">${m.t}</span></div>
        <div class="t-sub">${m.main}${m.sub ? " · " + m.sub : ""}</div>
        ${m.note ? `<div class="t-note">${m.note}</div>` : ""}
        <div class="t-macro">${m.m}</div>`));
    });
  } else {
    let lastGroup = null;
    d.supps.forEach((s,i)=>{
      if(s.g !== lastGroup){
        const lbl = document.createElement("div");
        lbl.className = "group-label";
        lbl.textContent = s.g;
        list.appendChild(lbl);
        lastGroup = s.g;
      }
      list.appendChild(makeItem("supps:s"+i, checks, `
        <div class="t-top"><span class="t-main">${s.n}</span></div>
        <div class="t-note">${s.s}</div>`));
    });
  }
  updateProgress(checks);
}

function renderNN(){
  const checks = loadChecks(viewIdx);
  const grid = $("#nnGrid");
  grid.innerHTML = "";
  NON_NEG.forEach((label,i)=>{
    const id = "nn:"+i;
    const el = document.createElement("div");
    el.className = "nn-chip" + (checks.has(id)?" is-done":"");
    el.setAttribute("role","checkbox");
    el.setAttribute("aria-checked", checks.has(id));
    el.tabIndex = 0;
    el.innerHTML = `<span class="chk"></span><span>${label}</span>`;
    const toggle = ()=>{
      const c = loadChecks(viewIdx);
      c.has(id) ? c.delete(id) : c.add(id);
      saveChecks(viewIdx, c);
      el.classList.toggle("is-done");
      el.setAttribute("aria-checked", c.has(id));
    };
    el.onclick = toggle;
    el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
    grid.appendChild(el);
  });
}

function render(){
  setAccent(DAYS[viewIdx].hue);
  renderDayStrip();
  renderHero();
  renderList();
  renderNN();
}

$("#seg").addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("is-on", x===b));
  renderList();
});

$("#resetBtn").onclick = ()=>{
  localStorage.removeItem(storeKey(viewIdx));
  render();
};

$("#todayDate").textContent = new Date().toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"});
render();
</script>
